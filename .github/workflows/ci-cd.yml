name: Salunea React CI

on:
  push:
    branches:
      - feat/react-convergence
    paths:
      - 'frontend-react/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend-react/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salunea-react-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-react:
    name: Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
